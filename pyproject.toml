[project]
name = "degeneration-probe"
version = "0.1.0"
description = "Research pipeline for measuring LLM text degeneration and building a degeneration probe"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.4.0",
  "transformers>=4.56.0",
  "accelerate>=0.20.0",
  "datasets>=2.0.0",
  "matplotlib>=3.8.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3.0",
  "wandb>=0.15.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
