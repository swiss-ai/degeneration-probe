[project]
name = "degeneration-demo"
version = "0.1.0"
description = "Small standalone demo for generation and degeneration checking"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.4.0",
  "transformers>=4.56.0",
  "accelerate>=0.20.0",
  "datasets>=2.0.0",
  "matplotlib>=3.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
