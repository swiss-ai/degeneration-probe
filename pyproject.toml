[project]
name = "degeneration-probe"
version = "0.1.0"
description = "Research pipeline for measuring LLM text degeneration and building a degeneration probe"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.4.0",
  "transformers>=4.56.0",
  "peft>=0.10.0",
  "accelerate>=0.20.0",
  "datasets>=2.0.0",
  "matplotlib>=3.8.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3.0",
  "wandb>=0.15.0",
  "openai>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "aiosqlite>=0.20.0",
  "websockets>=13.0",
  "gradio>=5.0.0",
  "websocket-client>=1.6.0",
  "jaxtyping>=0.3.7",
  "termcolor>=3.3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
