# Config for the degeneration-dataset-apertus1p5-sft256k-4200 build --
# rollouts from the local checkpoint
# /capstor/store/cscs/swissai/infra01/reasoning/models/ap1p5-8b-sft-256k-adam-lr6e-5-constant-128n_4200
# (Apertus 1.5 Omni SFT, group infra01, read access confirmed 2026-07-12).
# One of three equally-important, directly-comparable datasets built from
# the same prompt sample (same sources, same n_prompts, same seed) -- see
# the sibling degeneration-dataset-apertus-8b-instruct.yaml (HF
# Apertus-8B-Instruct) and
# degeneration-dataset-apertus1p5-capfilter-linear-it8816.yaml configs,
# which differ only in model_name/tokenizer_name and output_root/work_root.
# Matches degeneration_probe.dataset_gen.config.DatasetGenConfig
# field-for-field -- load with
# DatasetGenConfig.from_yaml("configs/dataset/degeneration-dataset-apertus1p5-sft256k-4200.yaml").
#
# *** BLOCKED: do not run generation against this config yet ***
# This checkpoint's own bundled tokenizer.json / tokenizer_config.json were
# overwritten on 2026-07-10 with a variant whose own NOTES.md in that
# directory says: "Internal use only -- not for model release / inference
# deployment" (a data-prep tool for the vision-tokenization SFT pipeline that
# rewrites raw '<think>'/'<answer>' etc. substrings on every encode()). The
# checkpoint's chat_template.jinja is unmodified and still emits literal
# '<think>'/'</think>' tokens, and the pre-overwrite originals are sitting
# right next to the live files as tokenizer.json.bak / tokenizer_config.json.bak.
# tokenizer_name is deliberately left unset (null) below rather than guessing
# which tokenizer is actually correct here -- the checkpoint owner (durech)
# needs to confirm whether the 2026-07-10 change was intentional before this
# dataset's tokenizer_name (and possibly a reconstructed tokenizer directory
# built from the .bak files) can be finalized. See the conversation this
# config was added in for the full investigation.
#
# model_name points directly at the checkpoint directory rather than an HF
# Hub repo id -- AutoModelForCausalLM.from_pretrained accepts a local
# directory transparently, and transformers>=4.57 (installed: 5.8.1)
# natively supports the "apertus" architecture, so no trust_remote_code is
# needed. This only loads the model weights; it does NOT resolve the
# tokenizer landmine above, since generate.py/cache_activations.py load the
# tokenizer from `tokenizer_name or model_name` -- until tokenizer_name is
# set explicitly, they would fall back to this checkpoint's own (currently
# suspect) live tokenizer files.
#
# n_prompts / max_new_tokens / temperature / top_p / seed / split_fractions
# are identical to the other two datasets' configs by design, so all three
# datasets are directly comparable.

model_name: "/capstor/store/cscs/swissai/infra01/reasoning/models/ap1p5-8b-sft-256k-adam-lr6e-5-constant-128n_4200"
tokenizer_name: null  # BLOCKED -- see header comment, do not fill in without confirming with durech first

in_domain_sources:
  - name: deepmath_103k
    hf_repo: "zwhe99/DeepMath-103K"
    hf_subset: null
    hf_split: "train"
    prompt_field: "question"
    n_prompts: 600

  - name: numinamath_1_5
    hf_repo: "AI-MO/NuminaMath-1.5"
    hf_subset: null
    hf_split: "train"
    prompt_field: "problem"
    n_prompts: 600

  - name: if_sft_data_verified
    hf_repo: "allenai/IF_sft_data_verified"
    hf_subset: null
    hf_split: "train"
    prompt_field: "messages"
    n_prompts: 600

  - name: llama_nemotron
    hf_repo: "nvidia/Llama-Nemotron-Post-Training-Dataset"
    hf_subset: "SFT"
    hf_split: "code"
    prompt_field: "input"
    n_prompts: 600

held_out_sources:
  - name: medical_o1
    hf_repo: "FreedomIntelligence/medical-o1-verifiable-problem"
    hf_subset: null
    hf_split: "train"
    prompt_field: "Open-ended Verifiable Question"
    n_prompts: 600

  # MathArena/aime_2025's "train" split only has 30 rows total (AIME I + II
  # 2025, 15 problems each) -- n_prompts is already capped at that real
  # maximum. build_prompts.py's sample_source_rows() clamps to the available
  # row count and warns rather than failing.
  - name: aime_2025
    hf_repo: "MathArena/aime_2025"
    hf_subset: null
    hf_split: "train"
    prompt_field: "problem"
    n_prompts: 30

n_rollouts_per_prompt: 10
max_new_tokens: 4096
temperature: 0.7
top_p: 0.9
seed: 42

output_root: "/capstor/store/cscs/swissai/infra01/users/mdenegri/degeneration-probe/degeneration-dataset-apertus1p5-sft256k-4200"
work_root: "/capstor/scratch/cscs/mdenegri/degeneration-probe/degeneration-dataset-apertus1p5-sft256k-4200_work"

split_fractions:
  train: 0.70
  val: 0.15
  test_indomain: 0.15
