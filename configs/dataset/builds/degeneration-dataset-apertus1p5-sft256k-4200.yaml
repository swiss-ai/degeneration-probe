# Dataset-generation recipe for Apertus 1.5 SFT 256k checkpoint 4200.
model_name: /capstor/store/cscs/swissai/infra01/reasoning/models/ap1p5-8b-sft-256k-adam-lr6e-5-constant-128n_4200
tokenizer_name: /capstor/store/cscs/swissai/infra01/reasoning/models/tokenizers/apertus_emu3.5_wavtok_text_only

in_domain_sources:
  - name: deepmath_103k
    hf_repo: zwhe99/DeepMath-103K
    hf_subset: null
    hf_split: train
    prompt_field: question
    n_prompts: 600
  - name: numinamath_1_5
    hf_repo: AI-MO/NuminaMath-1.5
    hf_subset: null
    hf_split: train
    prompt_field: problem
    n_prompts: 600
  - name: if_sft_data_verified
    hf_repo: allenai/IF_sft_data_verified
    hf_subset: null
    hf_split: train
    prompt_field: messages
    n_prompts: 600
  - name: llama_nemotron
    hf_repo: nvidia/Llama-Nemotron-Post-Training-Dataset
    hf_subset: SFT
    hf_split: code
    prompt_field: input
    n_prompts: 600
  - name: aime_2025
    hf_repo: MathArena/aime_2025
    hf_subset: null
    hf_split: train
    prompt_field: problem
    n_prompts: 30

held_out_sources:
  - name: medical_o1
    hf_repo: FreedomIntelligence/medical-o1-verifiable-problem
    hf_subset: null
    hf_split: train
    prompt_field: Open-ended Verifiable Question
    n_prompts: 600
  - name: codeforces
    hf_repo: open-r1/codeforces
    hf_subset: verifiable-prompts
    hf_split: train
    prompt_field: prompt
    n_prompts: 600
    filter_field: rating
    min_value: 2000

n_rollouts_per_prompt: 10
max_new_tokens: 4096
temperature: 0.7
top_p: 0.9
seed: 42

output_root: /capstor/store/cscs/swissai/infra01/users/mdenegri/degeneration-probe/degeneration-dataset-apertus1p5-sft256k-4200
work_root: /capstor/scratch/cscs/mdenegri/degeneration-probe/degeneration-dataset-apertus1p5-sft256k-4200_work

split_fractions:
  train: 0.70
  val: 0.15
  test_indomain: 0.15
