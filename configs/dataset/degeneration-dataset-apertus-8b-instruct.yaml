short_name: apertus-8b-instruct
build_root: /capstor/store/cscs/swissai/infra01/users/mdenegri/degeneration-probe/degeneration-dataset-apertus-8b-instruct
build_config: configs/dataset/builds/degeneration-dataset-apertus-8b-instruct.yaml

splits:
  train: train
  validation: val
  test_indomain: test_indomain
  test_heldout_domains: test_heldout_domains

tokenization:
  max_length: 4608
  max_completion_length: 4096
  prompt_truncation_side: left

sampling:
  # Keep every rollout with a defined onset and sample EOS rollouts per domain.
  train_negative_rollouts_per_positive: 4.0
  # Final evaluation keeps every usable rollout.
  evaluation_negative_rollouts_per_positive: null
  domain_stratified: true
  seed: 42
