model:
  name: Qwen/Qwen2.5-0.5B    # base (non-instruct) — degenerates readily on instruct-style prompts
  dtype: bfloat16
  max_new_tokens: 2048
  temperature: 0.7
  top_p: 0.9

dataset:
  name: teknium/OpenHermes-2.5
  subset: null
  split: train
  prompt_field: null      # auto-detect (conversations[].from=='human')
  max_samples: 200
  shuffle: true
  seed: 42
  max_prompts: 100

analysis:
  chunk_size: 256
  n_values: [1, 3]
