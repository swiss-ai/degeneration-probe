# Qwen-0.5B (base) degeneration probe trained on the aggregate HF dataset.
# Note: the dataset's completions were generated by Apertus-8B-Instruct, but
# we re-tokenise them with Qwen and ask Qwen's hidden states to predict the
# 1 - TTR signal — the probe learns repetition detection from Qwen's view.
# Runs locally (CPU/MPS smoke) and on cluster.
model:
  name: Qwen/Qwen2.5-0.5B

probe:
  layer: 12             # middle of Qwen-0.5B's 24 layers
  lora:
    enabled: true
    rank: 16
    alpha: 32
    dropout: 0.0

hf_dataset:
  name: luca-sartori/degeneration-probe-instruct
  train_split: train
  eval_split: validation
  # Subsample by default — full dataset is ~67k rows, way more than this
  # tiny model needs. Bump these up on cluster runs.
  max_train_rows: 2000
  max_eval_rows: 500

max_length: 2048

label:
  window_size: 256
  primary_n: 1

learning_rate:
  head: 5.0e-3
  lora: 5.0e-5

batch_size: 4
num_epochs: 3
seed: 42

wandb_project: null
output_dir: outputs/probes
