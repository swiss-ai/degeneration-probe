probe:
  layer: 12             # middle layer (Qwen2.5-0.5B has 24; override per model)
  lora:
    enabled: true
    rank: 16
    alpha: 32
    dropout: 0.0

# Data — list of JSONL paths from the generate step.
# Model is auto-resolved from these files (no model field needed).
train_data:
  - outputs/generations/20260403_115426/data/generations.jsonl

eval_data: null         # if null, split from train_data
eval_fraction: 0.2
max_length: 2048

# Per-token labels: 1 - TTR of the next `window_size` completion tokens.
label:
  window_size: 256      # forward sliding window size
  primary_n: 1          # n-gram size for TTR

learning_rate:
  head: 5.0e-3
  lora: 5.0e-5

batch_size: 4
num_epochs: 10
seed: 42

wandb_project: null
output_dir: outputs/probes
