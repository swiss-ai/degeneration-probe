# Config for the dataset-v2 pilot build. Matches
# degeneration_probe.dataset_gen.config.PilotDatasetConfig field-for-field --
# load with PilotDatasetConfig.from_yaml("configs/dataset_gen/pilot_v1.yaml").

model_name: "swiss-ai/Apertus-8B-Instruct-2509"

in_domain_sources:
  - name: deepmath_103k
    hf_repo: "zwhe99/DeepMath-103K"
    hf_subset: null
    hf_split: "train"
    prompt_field: "question"
    n_prompts: 70

  - name: numinamath_1_5
    hf_repo: "AI-MO/NuminaMath-1.5"
    hf_subset: null
    hf_split: "train"
    prompt_field: "problem"
    n_prompts: 70

  # allenai/IF_sft_data_verified has no top-level "prompt" column -- its real
  # schema is ["id", "messages", "source", "model_completion"], where
  # "messages" is a conversation list (one "user" turn per row in practice).
  # build_prompts.py's extract_prompt_text() pulls the first user turn's
  # content out of this list.
  - name: if_sft_data_verified
    hf_repo: "allenai/IF_sft_data_verified"
    hf_subset: null
    hf_split: "train"
    prompt_field: "messages"
    n_prompts: 70

  # nvidia/Llama-Nemotron-Post-Training-Dataset has no top-level splits --
  # per its dataset card, splits only exist within named configs ("SFT" with
  # splits code/math/science/chat/safety, or "RL" with split
  # instruction_following). hf_subset must be "SFT" for the "code" split to
  # resolve at all (previously null, which would fail to load). Chose the
  # "code" split (as the prior placeholder already assumed) to diversify the
  # in-domain pool with a non-math/non-instruction-following task category;
  # "input" is a single-turn conversation list, handled the same way as
  # if_sft_data_verified's "messages" above. Note: the "code" split spans two
  # ~18-48GB JSONL files, so build_prompts.py reads it via streaming and only
  # scans a bounded prefix of STREAMING_PREFIX_SCAN_SIZE (5,000) rows from the
  # front of the stream -- not a full download, and not a shuffle over the
  # whole split -- then shuffles/samples n_prompts from that prefix with the
  # same deterministic Fisher-Yates logic used for the fully-downloaded
  # sources. This is a deliberate pilot-scale tradeoff (prefix bias instead of
  # a full-split uniform sample); see build_prompts.py's module docstring.
  - name: llama_nemotron
    hf_repo: "nvidia/Llama-Nemotron-Post-Training-Dataset"
    hf_subset: "SFT"
    hf_split: "code"
    prompt_field: "input"
    n_prompts: 70

held_out_sources:
  - name: medical_o1
    hf_repo: "FreedomIntelligence/medical-o1-verifiable-problem"
    hf_subset: null
    hf_split: "train"
    prompt_field: "Open-ended Verifiable Question"
    n_prompts: 60

  # NOTE: MathArena/aime_2025's "train" split only has 30 rows total (AIME I
  # + II 2025, 15 problems each) -- fewer than n_prompts=60. hf_split/
  # prompt_field are correct (verified against the real schema); the n_prompts
  # shortfall is handled at runtime by build_prompts.py's sample_source_rows(),
  # which clamps to the available row count and prints a warning rather than
  # failing, so all 30 aime_2025 prompts end up in test_heldout_domains.
  - name: aime_2025
    hf_repo: "MathArena/aime_2025"
    hf_subset: null
    hf_split: "train"
    prompt_field: "problem"
    n_prompts: 60

n_rollouts_per_prompt: 10
max_new_tokens: 1024
temperature: 0.7
top_p: 0.9
seed: 42

output_root: "/capstor/store/cscs/swissai/infra01/users/mdenegri/degeneration-probe/dataset_v2_pilot"
work_root: "/capstor/scratch/cscs/mdenegri/degeneration-probe/dataset_v2_pilot_work"

split_fractions:
  train: 0.70
  val: 0.15
  test_indomain: 0.15
