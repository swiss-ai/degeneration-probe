short_name: degeneration
task: degeneration

probe:
  id: ${model.short_name}_degeneration_${dataset.short_name}_${training.loss.name}_layer${training.probe.layer}
  layer: 30
  # Several depths at once, for example [8,12,16]. Every layer of a rollout
  # lives in one file and opening it costs far more than reading it, so a head
  # per depth trained over a single pass costs little more than one head does.
  # The heads share no parameters and their losses are added, which leaves each
  # one's gradient identical to what it would be trained on its own.
  layers: null
  dtype: float32
  normalization: layernorm
  context_window_size: 1

features:
  # adapted (run the model) | cached (read stored activations, no adapters)
  regime: adapted

lora:
  enabled: true
  layers: all
  rank: 16
  alpha: 32
  dropout: 0.05

selection:
  # all_tokens | rollout_balanced | random_window | frontier_window |
  # frontier_window_hard_negative
  strategy: all_tokens
  window_size: 128
  # frontier_window: trailing (run-up only) | centered (straddles the frontier)
  anchor: trailing
  positive_fraction: 0.25
  max_rollouts_per_prompt: null
  hard_negative_fraction: 0.5
  resample_each_epoch: true

budget:
  # Tokens each optimizer step sees. Held equal across rules, this is what makes
  # them comparable; left unset, the accumulation from runtime is used as is.
  tokens_per_step: null
  # Minimum spread of the probe's scores on the monitor. Below this it has
  # collapsed to a constant, which converges and scores plausibly.
  collapse_threshold: 0.01

stopping:
  # Whether a run ends itself once every depth has stopped improving. Switched
  # off, the rule is still measured and recorded, and the run trains to whatever
  # step budget it was given.
  enabled: true
  # Coverage inside the loop a depth must reach before its checkpoints can be
  # selected from. A depth below it has not learned to see the obvious and can
  # post a flattering number before the frontier by accident.
  floor: 0.3
  # The run-up width the objective is measured over, in tokens.
  band: 256
  # How much better a step has to be to count as an improvement, and how many
  # evaluations may pass without one. These set how long a run trains much more
  # than what it reports: across the range that has been measured, the depth a
  # run is reported at does not move and its value moves by a few percent, while
  # the step it stops at roughly doubles.
  tolerance: 0.002
  patience: 4

label:
  # frontier_hard | frontier_soft | token_signal
  family: frontier_hard
  # frontier_hard: y(t)=1 iff f_r - t <= horizon
  horizon: 0
  # frontier_soft: how the run-up decays back from the frontier
  decay: exponential
  decay_length: 256
  # token_signal: repetition_score | entropy
  signal: repetition_score

loss:
  name: bce
  bce:
    use_pos_weight: true
  mse:
    output_activation: sigmoid

optimizer:
  probe_learning_rate: 1e-4
  lora_learning_rate: 1e-4
  weight_decay: 0.0

runtime:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 1
  max_steps: -1
  max_grad_norm: 1.0
  gradient_checkpointing: true
  logging_steps: 10
  dataloader_num_workers: 0
  seed: 42

validation:
  # Frequent enough to see where a head stops improving. Most heads settle
  # inside the first few hundred steps, so a coarse cadence leaves the only
  # interesting stretch of training unmeasured and the earliest checkpoint
  # looking best by default.
  strategy: steps
  steps: 50
  # Rollouts the monitoring split is cut to, keeping every positive. Evaluation
  # reads whole rollouts while training reads a short window of one, so a probe
  # covering many depths pays for every token of every layer each time it is
  # monitored. Unset means the whole split.
  max_rollouts: null
  # Splits the end-of-run evaluation covers. Unset means all of them.
  final_splits: null
  # Extension point for future onset_detection and early_detection metrics.
  metrics: []

checkpoint:
  # Each run gets its own directory under this root, named after its axes.
  root_dir: ${oc.env:PROBE_OUTPUT_DIR,outputs}
  # Checkpoints hold the probe head and the adapters only, so saving on the
  # validation cadence is cheap and every run stays resumable.
  # Selection compares checkpoints, so the saving cadence has to match the
  # validation cadence or the step a metric picked has no weights behind it.
  strategy: steps
  steps: 50
  # A checkpoint holds one small head per depth, so a long run's worth costs a
  # few hundred megabytes. Keeping all of them is what allows a selection rule
  # to be reconsidered later without retraining anything.
  save_total_limit: null
  keep_best: true
  # Selection runs on coverage of the run-up, gated on coverage inside the loop.
  # Both a ranking and rollout-level recall reach their ceiling long before the
  # probe is useful: on a split with a hundred degenerate answers, recall under
  # a cap on false alarms reads the same at every step of a run, so the
  # checkpoint it picks is whichever one happened to catch one more answer.
  # Coverage of the approach keeps separating checkpoints after that, and it is
  # the quantity the project is about.
  metric_for_best_model: selection_score
  greater_is_better: true
  resume: auto

wandb:
  enabled: true
  mode: online
  # Personal workspace: no shared team entity yet.
  entity: null
  project: degeneration-probes
  # Name, group and axis tags are derived from the run's own settings.
  name: null
  group: null
  job_type: train
  # Extra labels for one sweep or ablation, for example [sweep:layer].
  tags: []
  notes: null
  resume: true
