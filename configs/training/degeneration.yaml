short_name: degeneration
task: degeneration

probe:
  id: ${model.short_name}_degeneration_${dataset.short_name}_${training.loss.name}_layer${training.probe.layer}
  layer: 30
  # Several depths at once, for example [8,12,16]. Every layer of a rollout
  # lives in one file and opening it costs far more than reading it, so a head
  # per depth trained over a single pass costs little more than one head does.
  # The heads share no parameters and their losses are added, which leaves each
  # one's gradient identical to what it would be trained on its own.
  layers: null
  dtype: float32
  normalization: layernorm
  context_window_size: 1

features:
  # adapted (run the model) | cached (read stored activations, no adapters)
  regime: adapted

lora:
  enabled: true
  layers: all
  rank: 16
  alpha: 32
  dropout: 0.05

selection:
  # all_tokens | rollout_balanced | random_window | frontier_window |
  # frontier_window_hard_negative
  strategy: all_tokens
  window_size: 128
  # frontier_window: trailing (run-up only) | centered (straddles the frontier)
  anchor: trailing
  positive_fraction: 0.25
  max_rollouts_per_prompt: null
  hard_negative_fraction: 0.5
  resample_each_epoch: true

budget:
  # Tokens each optimizer step sees. Held equal across rules, this is what makes
  # them comparable; left unset, the accumulation from runtime is used as is.
  tokens_per_step: null
  # Evaluations without improvement before stopping; null disables it.
  patience: null
  # Minimum spread of the probe's scores on the monitor. Below this it has
  # collapsed to a constant, which converges and scores plausibly.
  collapse_threshold: 0.01

label:
  # frontier_hard | frontier_soft | token_signal
  family: frontier_hard
  # frontier_hard: y(t)=1 iff f_r - t <= horizon
  horizon: 0
  # frontier_soft: how the run-up decays back from the frontier
  decay: exponential
  decay_length: 256
  # token_signal: repetition_score | entropy
  signal: repetition_score

loss:
  name: bce
  bce:
    use_pos_weight: true
  mse:
    output_activation: sigmoid

optimizer:
  probe_learning_rate: 1e-4
  lora_learning_rate: 1e-4
  weight_decay: 0.0

runtime:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 1
  max_steps: -1
  max_grad_norm: 1.0
  gradient_checkpointing: true
  logging_steps: 10
  dataloader_num_workers: 0
  seed: 42

validation:
  strategy: epoch
  steps: null
  # Rollouts the monitoring split is cut to, keeping every positive. Evaluation
  # reads whole rollouts while training reads a short window of one, so a probe
  # covering many depths pays for every token of every layer each time it is
  # monitored. Unset means the whole split.
  max_rollouts: null
  # Splits the end-of-run evaluation covers. Unset means all of them.
  final_splits: null
  # Extension point for future onset_detection and early_detection metrics.
  metrics: []

checkpoint:
  # Each run gets its own directory under this root, named after its axes.
  root_dir: ${oc.env:PROBE_OUTPUT_DIR,outputs}
  # Checkpoints hold the probe head and the adapters only, so saving on the
  # validation cadence is cheap and every run stays resumable.
  strategy: epoch
  steps: null
  save_total_limit: 2
  keep_best: true
  # Selection runs on the operating point rather than on a ranking. Telling a
  # mostly-degenerate rollout from a healthy one is easy, so ranking reaches
  # its ceiling long before the probe is useful and stops separating
  # checkpoints; recall under a cap on false alarms keeps moving after that.
  metric_for_best_model: recall_at_budget
  greater_is_better: true
  resume: auto

wandb:
  enabled: true
  mode: online
  # Personal workspace: no shared team entity yet.
  entity: null
  project: degeneration-probes
  # Name, group and axis tags are derived from the run's own settings.
  name: null
  group: null
  job_type: train
  # Extra labels for one sweep or ablation, for example [sweep:layer].
  tags: []
  notes: null
  resume: true
