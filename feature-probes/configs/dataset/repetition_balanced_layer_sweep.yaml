# @package _global_
# Layer sweep over apertus_stability_fp32 + LoRA.
# 1 epoch, eval on validation AND test, raw predictions dumped per dataset.
dataset:
  short_name: "repetition_balanced_layer_sweep"

wandb_project: "degeneration-probes"
task: repetition_score
lambda_lm: 0.0
lambda_kl: 0.0
anneal_max_aggr: false

# IMPORTANT: save_roc_curves=true is needed to enable save_dir in trainer.evaluate;
# for task=repetition_score the ROC plot itself is skipped (see evaluate.py:239).
save_roc_curves: true
dump_raw_eval_results: true

regression_loss: mse
regression_output_activation: sigmoid
degeneration_threshold: 0.8

num_train_epochs: 1
# evaluation_strategy="no" prevents the HF Trainer auto-eval at epoch end from
# populating the cache in ProbeTrainer.evaluate() and short-circuiting the
# final manual evaluation (which is the one that dumps raw predictions).
evaluation_strategy: "no"
logging_steps: 10

train_datasets:
  - dataset_id: "repetition_train"
    hf_repo: "lorenzo0312/degeneration-probe-instruct-token-level-balanced"
    subset: null
    split: "train"
    max_length: 4608
    max_completion_length: 4096
    prompt_truncation_side: left
    default_ignore: true
    last_span_token: false
    ignore_buffer: 0
    pos_weight: 1.0
    neg_weight: 1.0
    shuffle: true
    seed: 42
    process_on_the_fly: false

eval_datasets:
  - dataset_id: "repetition_validation"
    hf_repo: "lorenzo0312/degeneration-probe-instruct-token-level-balanced"
    subset: null
    split: "validation"
    max_length: 4608
    max_completion_length: 4096
    prompt_truncation_side: left
    pos_weight: 1.0
    neg_weight: 1.0
    default_ignore: true
    shuffle: false

  - dataset_id: "repetition_test"
    hf_repo: "lorenzo0312/degeneration-probe-instruct-token-level-balanced"
    subset: null
    split: "test"
    max_length: 4608
    max_completion_length: 4096
    prompt_truncation_side: left
    pos_weight: 1.0
    neg_weight: 1.0
    default_ignore: true
    shuffle: false
